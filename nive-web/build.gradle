plugins {
//    id 'java'
    id 'java-library'
    id 'io.spring.dependency-management'

}

group = 'com.nive'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

/**
 * spring 버전 강제(TODO 통합 버전 관리는 진행해야함.)
 */
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.4"
    }
}

dependencies {
    //web을 의존하면 모두 노출 처리
    api project(":nive-common")
    api project(":nive-domain")
    api project(":nive-application")


    /*================================================================================================
     * Spring WEB + Swagger (example-application에서 전파됨.)
    * ================================================================================================
	* */
    api 'org.springframework.boot:spring-boot-starter'
//    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'    //swagger 용 dependency(3버전 이상은 해당 디펜던시를 사용)
    api 'org.springframework.boot:spring-boot-starter-data-jpa'


//    /*================================================================================================
//     * QueryDSL
//    * ================================================================================================
//    * */
//    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
//    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
//    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'


    /*================================================================================================
     * security + JWT Token
    * ================================================================================================
    * */
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // or gson

    /*================================================================================================
     * redis
    * ================================================================================================
    * */
    // Bucket4j core
    implementation("com.bucket4j:bucket4j_jdk17-core:8.14.0")
    //Redis for rate limit storage
    implementation("com.bucket4j:bucket4j_jdk17-redis:8.14.0")
    // Redisson adapter (JDK 17 전용)
    implementation("com.bucket4j:bucket4j_jdk17-redisson:8.14.0")

    // Redisson client (필수)
    implementation 'org.redisson:redisson:3.23.5'

    // Spring Data Redis (optional – RedisTemplate 등 사용할 경우)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /*================================================================================================
     * 기타 라이브러리
    * ================================================================================================
    * */
//    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.24'		//국제번호 체크 전화번호

    // Apache POI for Excel
    implementation 'org.apache.poi:poi:5.2.5'         // .xls (HSSF)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'   // .xlsx (XSSF)

//    implementation 'org.springframework.boot:spring-boot-starter-actuator'	//spring actuator
//    implementation 'io.micrometer:micrometer-registry-prometheus'			//프로메테우스 엔드포인트 추가



    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}